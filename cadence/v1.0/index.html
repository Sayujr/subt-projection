  stockEd: (ds, el) => { const st = stock().map(x => ({...x})); const it = st.find(x => x.id === ds.id); if (!it) return; if (ds.f === "expires"){ const v = el.value.trim(); if (validISO(v)) it.expires = v; else delete it.expires; } else it[ds.f] = el.value.trim().slice(0, ds.f === "name" ? 80 : 40); it.at = Date.now(); if (ds.f === "name" && !it.name) st.splice(st.indexOf(it), 1); S.profile = {...S.profile, stock:st}; saveProfile(); markClientEdit(); },
  stockAdd: (ds, el) => { const v = el.value.trim(); if (!v) return; S.profile = {...S.profile, stock:[...stock(), {id:uid(), area:ds.area, name:v.slice(0, 80), amount:"", note:"", useUp:false, at:Date.now(), day:today()}]}; el.value = ""; saveProfile(); markClientEdit(); render(); },
  maint: (ds, el) => { const v = Math.round(Number(el.value) / 10) * 10; if (!(v >= 1200 && v <= 5000)) return; const cur = S.meta.maintenance || {}; if (v === Number(cur.kcal)) return; saveMeta({maintenance:{...cur, kcal:v, source:"client", updatedAt:today(), history:[...(cur.history || []), {date:today(), kcal:v, source:"client", note:"Starting figure set by you"}].slice(-60)}}); },
  bodyfat: (ds, el) => { const v = Number(el.value); const cur = S.meta.maintenance || {}; if (!el.value){ const c = {...cur}; delete c.bodyFat; saveMeta({maintenance:c}); return; } if (v >= 4 && v <= 60) saveMeta({maintenance:{...cur, bodyFat:Math.round(v * 10) / 10}}); },
  target: (ds, el) => { const t = {...targets()}; const v = Number(el.value); if (v > 0) t[ds.k] = Math.round(v); else delete t[ds.k]; saveMeta({targets:t}); },
  edStory: (ds, el) => saveMeta({story:el.value.slice(0, 1500), storyAt:Date.now(), coach:{...(S.meta.coach || {}), clientEditedAt:Date.now()}}),
  height: (ds, el) => { const v = Math.round(Number(el.value)); if (v >= 120 && v <= 230) saveMeta({body:{...(S.meta.body || {}), heightCm:v}}); },
  autoBackup: (ds, el) => saveMeta({backup:{...(S.meta.backup || {}), auto:!!el.checked}}),
  rc: (ds, el) => { const rs = recipes().slice(), i = rs.findIndex(r => r.id === ds.id); if (i < 0) return; const r = {...rs[i]};
    if (ds.f === "title"){ const v = el.value.trim(); if (!v) return; r.title = v.slice(0, 80); }
    else if (ds.f === "servings"){ const v = Number(el.value); if (v > 0) r.servings = Math.round(v); r.stale = !!r.perServing; }
    else if (ds.f === "ingredients"){ r.ingredients = lines(el.value).slice(0, 40); r.stale = !!r.perServing; }
    else if (ds.f === "steps") r.steps = lines(el.value).slice(0, 30);
    else if (ds.f === "notes") r.notes = el.value.slice(0, 600);
    r.updatedAt = Date.now(); r.history = [...(r.history || []), {date:today(), change:"Edited by you"}].filter((h, k, a) => !(h.change === "Edited by you" && a[k - 1] && a[k - 1].change === "Edited by you" && a[k - 1].date === h.date)).slice(-20);
    rs[i] = r; S.profile = {...S.profile, recipes:rs}; saveProfile(); },
  edItem: (ds, el) => { const secs = clone(S.profile.sections || {}); const it = (secs[ds.sec] || []).find(i => i.id === ds.id); if (!it) return; const v = el.value.trim(); if (!v){ secs[ds.sec] = secs[ds.sec].filter(i => i.id !== ds.id); } else { it.text = v.slice(0, 300); it.at = Date.now(); it.quote = "Edited by you"; } S.profile = {...S.profile, sections:secs}; saveProfile(); markClientEdit(); },
  addItem: (ds, el) => { const v = el.value.trim(); if (!v) return; const secs = clone(S.profile.sections || {}); (secs[ds.sec] = secs[ds.sec] || []).push({id:uid(), text:v.slice(0, 300), at:Date.now(), day:today(), quote:"Added by you", photo:null}); el.value = ""; S.profile = {...S.profile, sections:secs}; saveProfile(); markClientEdit(); render(); },
  edNote: (ds, el) => { const c = clone(S.meta.coach || {}); const arr = c[ds.k] || []; const i = Number(ds.i); if (!(i in arr)) return; if (ds.f) arr[i][ds.f] = el.value.slice(0, 900); else arr[i] = el.value.slice(0, 300); c[ds.k] = arr; saveCoach(c); },
  pend: (ds, el) => { S.camOpen = false; for (const f of [...el.files].slice(0, 6 - S.pending.length)) S.pending.push({file:f, url:URL.createObjectURL(f)}); el.value = ""; renderComposer(); },
  lookshot: async (ds, el) => {
    const files = [...el.files]; el.value = ""; if (!files.length) return;
    const m = msgsOf(ds.date).find(x => x.id === ds.id); if (!m) return;
    await patchMessage(ds.date, ds.id, {answered:{text:`Sent a screenshot`}});
    const up = await uploadPhotos(files, "label");
    if (!up.ids.length) return;
    await addMessages(today(), [{id:uid(), role:"me", text:"", photos:up.ids, at:Date.now(), time:nowTime()}]);
    await coachTurn(`They sent a screenshot of the nutrition info for "${m.widget.query}" (attached). Read the label carefully (serving size, calories, protein, carbs, fat, saturated fat, fiber), then use it.`, up.blobs);
  },
  wphoto: async (ds, el) => {
    const files = [...el.files]; el.value = ""; if (!files.length) return;
    const msg = msgsOf(ds.date).find(m => m.id === ds.id); if (!msg) return;
    await patchMessage(ds.date, ds.id, {answered:{text:`Sent ${files.length} photo${files.length > 1 ? "s" : ""}`}});
    const up = await uploadPhotos(files, ds.kind);
    if (!up.ids.length) return;
    const d = today();
    await addMessages(d, [{id:uid(), role:"me", text:"", photos:up.ids, at:Date.now(), time:nowTime()}]);
    await coachTurn(`They sent ${up.ids.length} photo(s) (attached) in reply to your request: "${msg.widget.prompt}". Look closely, name what you see, add lasting things to their file (e.g. fridge, snack_stock, food_prep, shopping), and respond like a coach.`, up.blobs);
  },
};
function setTab(t){ if (t !== "data"){ S.pick = null; const pk = $("#pick"); if (pk) pk.hidden = true; } S.tab = t; store.set("tab", t); if (location.hash.slice(1) !== t) history.replaceState(null, "", "#" + t); render(t === "coach"); if (t !== "coach") window.scrollTo({top:0}); }

document.addEventListener("pointerdown", () => { S.ptrDown = true; }, true);
const ptrUp = () => setTimeout(() => { S.ptrDown = false; if (S.pendingRender){ const sc = S.pendingScroll; S.pendingRender = false; S.pendingScroll = false; render(sc); } }, 0);
document.addEventListener("pointerup", ptrUp, true);
document.addEventListener("pointercancel", ptrUp, true);
document.addEventListener("click", e => {
  if (S.menuOpen && !e.target.closest("#menu") && !e.target.closest(".menub")){ S.menuOpen = false; renderMenu(); }
  if (S.pinOpen && !e.target.closest("#pinsheet") && !e.target.closest("#pinfab") && !e.target.closest("#waterfab") && !e.target.closest("#take") && !e.target.closest("#mfsheet")){ S.pinOpen = false; renderPins(); renderWater(); }
  if (S.trainOpen && !e.target.closest("#trainsheet") && !e.target.closest("#trainfab")){ S.trainOpen = false; renderPins(); }
  const tb = e.target.closest("#tabs [data-tab]"); if (tb){ setTab(tb.dataset.tab); return; }
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (fn) fn(b.dataset, b, e);
});
document.addEventListener("change", e => { const t = e.target; if (t.dataset && t.dataset.ch && CH[t.dataset.ch]) CH[t.dataset.ch](t.dataset, t); });
document.addEventListener("input", e => { if (e.target.id === "msg"){ S.draft = e.target.value; autosize(e.target); } });
document.addEventListener("keydown", e => { if (e.target.id === "msg" && e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
// chart hover: crosshair + tooltip
document.addEventListener("pointermove", e => {
  const svg = e.target.closest && e.target.closest("svg[data-tips]"); const tip = $("#tip");
  document.querySelectorAll("svg[data-tips] .xh").forEach(l => { if (!svg || !svg.contains(l)) l.setAttribute("visibility", "hidden"); });
  if (!svg){ tip.hidden = true; return; }
  const pts = JSON.parse(svg.dataset.tips || "[]"); if (!pts.length){ tip.hidden = true; return; }
  const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, sx = (e.clientX - r.left) / r.width * vb.width;
  let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - sx) < Math.abs(best[0] - sx)) best = p;
  const xh = svg.querySelector(".xh"); xh.setAttribute("x1", best[0]); xh.setAttribute("x2", best[0]); xh.setAttribute("visibility", "visible");
  tip.textContent = best[2]; tip.hidden = false;
  tip.style.left = (r.left + best[0] / vb.width * r.width) + "px"; tip.style.top = (r.top + best[1] / vb.height * r.height) + "px";
  if (e.pointerType === "mouse" && S.chartHover !== best[2]){ S.chartHover = best[2]; clearTimeout(S.chartHoverT); S.chartHoverT = setTimeout(() => chartTake(svg, best), 800); }
});
function chartTake(svg, best){
  const title = svg.dataset.title || "Chart", r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, x = r.left + best[0] / vb.width * r.width, y = r.top + best[1] / vb.height * r.height;
  showTake({dataset:{label:`${title} · ${best[2]}`, detail:`On their ${title} chart they're looking at: ${best[2]}.`, where:"Dashboard › Versus maintenance"}, getBoundingClientRect:() => ({left:x - 40, top:y - 10, bottom:y + 10, right:x + 40})});
}
(function(){
  let hold = null;
  document.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") return; const svg = e.target.closest && e.target.closest("svg[data-tips]"); if (!svg) return; const pts = JSON.parse(svg.dataset.tips || "[]"); if (!pts.length) return;
    const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, sx = (e.clientX - r.left) / r.width * vb.width; let best = pts[0]; for (const q of pts) if (Math.abs(q[0] - sx) < Math.abs(best[0] - sx)) best = q;
    clearTimeout(hold); hold = setTimeout(() => { S.chartHeld = true; chartTake(svg, best); }, 480); });
  for (const ev of ["pointerup","pointercancel"]) document.addEventListener(ev, () => clearTimeout(hold));
  document.addEventListener("click", e => { if (S.chartHeld && e.target.closest && e.target.closest("svg[data-tips]")){ S.chartHeld = false; e.stopImmediatePropagation(); e.preventDefault(); } }, true);
})();
document.addEventListener("click", e => {
  const svg = e.target.closest && e.target.closest("svg[data-tips]"); if (!svg) return;
  const pts = JSON.parse(svg.dataset.tips || "[]"); if (!pts.length) return;
  const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, sx = (e.clientX - r.left) / r.width * vb.width;
  let best = pts[0]; for (const q of pts) if (Math.abs(q[0] - sx) < Math.abs(best[0] - sx)) best = q;

  S.pick = {label:`${title} · ${best[2]}`, detail:`On their ${title} chart (${dataRange().label}), they tapped ${best[2]}. Values in view: ${pts.slice(-31).map(q => q[2]).join("; ")}`};
  // a tap on a day or week goes straight to Ren, ready to check or fix it

});

try { S.hideMaint = localStorage.getItem("cad.hideMaint") === "1"; S.hideTgt = localStorage.getItem("cad.hideTgt") === "1"; } catch {}
if (window.__test) window.__cad = {energyModel, maint, mfText, buildPrompt, weekStats, reviewDueWeek, S, renderWater, waterDue, scaleCheck, recoveryNow, applyCoach, stock, gotos, coachTurn, deviationsFor, planFor, dayChangesText, weekChangesText, takePrompt};
