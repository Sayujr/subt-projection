<title>Cadence 1.0 backup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a phone-first app shell. Coach voice set in a book serif, the client's voice in a clean sans; bottom tab bar like a native app. */
:root{
  --bg:#EDF0EC; --surface:#FAFBF9; --sunk:#E2E7E2; --ink:#16211C; --muted:#5B6962; --line:#D0D8D2;
  --accent:#34488E; --accent-ink:#FFFFFF; --accent-soft:#DCE2F3; --warm:#C9762E; --warm-soft:#F5E3D0;
  --good:#2D7A53; --good-soft:#D7EBDF; --warn:#A8701A; --hard:#9A4A55; --hard-soft:#F1DCDF;
  --me:#16211C; --me-ink:#F4F6F3;
  --voice:"Newsreader", "Iowan Old Style", Georgia, serif;
  --ui:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --tab-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1312; --surface:#151C1A; --sunk:#1C2522; --ink:#E5ECE7; --muted:#92A29A; --line:#26312D;
  --accent:#93A6EA; --accent-ink:#0E1430; --accent-soft:#222B4B; --warm:#E9A35E; --warm-soft:#3A2A1C;
  --good:#66C493; --good-soft:#1C3328; --warn:#E3A84C; --hard:#E28F9A; --hard-soft:#3A2228;
  --me:#E5ECE7; --me-ink:#101614; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1312; --surface:#151C1A; --sunk:#1C2522; --ink:#E5ECE7; --muted:#92A29A; --line:#26312D;
  --accent:#93A6EA; --accent-ink:#0E1430; --accent-soft:#222B4B; --warm:#E9A35E; --warm-soft:#3A2A1C;
  --good:#66C493; --good-soft:#1C3328; --warn:#E3A84C; --hard:#E28F9A; --hard-soft:#3A2228;
  --me:#E5ECE7; --me-ink:#101614; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.mark{font:italic 500 24px/1 var(--voice);letter-spacing:-.01em;margin:0}
.coachline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
main{padding-block:16px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px))}
main.chatmode{padding-bottom:calc(var(--tab-h) + 130px + env(safe-area-inset-bottom,0px))}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabbar .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabbar button{appearance:none;border:0;background:transparent;color:var(--muted);font:500 11px var(--ui);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;letter-spacing:.02em}
nav.tabbar button svg{width:22px;height:22px}
nav.tabbar button[aria-selected="true"]{color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within,summary:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.h1{font:400 30px/1.15 var(--voice);margin:0;letter-spacing:-.01em}
.h2{font:500 20px/1.25 var(--voice);margin:0}
.eyebrow{font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 14px var(--ui);padding:9px 15px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
a.btn{text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.sm{font-size:13px;padding:6px 12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 12px var(--ui);padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warm{background:var(--warm-soft);color:var(--warm)} .chip.acc{background:var(--accent-soft);color:var(--accent)} .chip.hard{background:var(--hard-soft);color:var(--hard)}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;min-width:0}
.notice{border-radius:14px;padding:12px 14px;background:var(--sunk);font-size:14px}
.notice.bad{background:var(--hard-soft)}

/* ---- Coach (chat) ---- */
.chat{display:flex;flex-direction:column;gap:6px}
.daysep{align-self:center;font:600 11px var(--ui);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:14px 0 6px}
.who{font:600 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px 4px}
.b{max-width:86%;padding:10px 14px;border-radius:20px;overflow-wrap:anywhere;white-space:pre-wrap}
.b.coach{align-self:flex-start;background:var(--surface);border:1px solid var(--line);font:400 17px/1.45 var(--voice);border-radius:6px 20px 20px 20px}
.b.coach + .b.coach{border-radius:6px 20px 20px 20px}
.b.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-radius:20px 6px 20px 20px;font-size:15px}
.mephotos{align-self:flex-end;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:86%}
.mephotos img{width:96px;height:96px;object-fit:cover;border-radius:14px;background:var(--sunk)}
.att{align-self:flex-start;max-width:92%;width:100%;display:flex;flex-direction:column;gap:8px;margin-left:2px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px/1.3 var(--ui);padding:11px 14px;border-radius:14px;cursor:pointer;display:flex;align-items:center;gap:10px}
.opt:hover{border-color:var(--accent)}
.opt .tick{flex:0 0 20px;height:20px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-size:13px}
.opt .tick.round{border-radius:50%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .tick{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opts.done .opt{cursor:default;opacity:.55}
.opts.done .opt[aria-pressed="true"]{opacity:1}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--ui);height:46px;border-radius:12px;cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scalelbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.photoask{border:1.5px dashed var(--accent);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.card{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card .lrow{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.card .lrow span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.card .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.card .read{font:italic 400 15px/1.45 var(--voice);color:var(--ink)}
.card details summary{font-size:13px;color:var(--accent);cursor:pointer}
.card details .src{font-size:12px;color:var(--muted)}
.ppin{appearance:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:50%;padding:0;cursor:pointer;flex:0 0 26px}
.ppin svg{width:12px;height:12px}
.ppin.on{background:var(--accent-soft)}
.ppin.on{color:var(--accent);border-color:var(--accent)}
.psum{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border-radius:12px;padding:8px 10px;margin:2px 0 4px}
.pkrow{display:flex;align-items:center;gap:8px;min-width:0}
.pk{font-size:11px;color:var(--muted);white-space:nowrap;flex:0 0 auto}
.pk b{font:600 15px/1 var(--ui);color:var(--ink)}
.pvs{font:600 11px var(--ui);color:var(--muted);white-space:nowrap;flex:0 0 auto}
.pvs.good{color:var(--good)} .pvs.warm{color:var(--warm)} .pvs.hard{color:var(--hard)}
.pbar{position:relative;flex:1 1 auto;min-width:40px;height:6px;border-radius:4px;background:color-mix(in srgb,var(--line) 70%,transparent)}
.pbar > i{position:absolute;top:0;bottom:0;left:0;border-radius:4px}
.pbar .pl{background:color-mix(in srgb,var(--accent) 38%,transparent)}
.pbar .so{background:var(--accent)}
.pbar .pm,.pbar .pt{width:0;top:-4px;bottom:-4px;border-radius:0}
.pbar .pm{border-left:2.5px dotted var(--ink);opacity:.9}
.pbar .pt{border-left:2px dotted var(--warm);opacity:.65}
.prow.extra .pname em{font-style:normal;color:var(--warm)}
.pmac{display:flex;flex-wrap:nowrap;gap:9px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pmac::-webkit-scrollbar{display:none}
.pm1{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);white-space:nowrap;flex:0 0 auto}
.pm1 svg{width:20px;height:20px;flex:0 0 20px}
.pm1 .rt{fill:none;stroke:color-mix(in srgb,var(--line) 80%,transparent);stroke-width:2}
.pm1 .rf{fill:none;stroke:var(--warm);stroke-width:2;stroke-linecap:round}
.pm1.ok .rf{stroke:var(--good)}
.pm1 .ic path{fill:none;stroke:var(--warm);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.pm1.ok .ic path{stroke:var(--good)}
.pm1 b{color:var(--ink);font-size:12px;font-weight:600}
.pdots{display:inline-flex;gap:2px;flex:0 0 auto;margin-top:6px}
.pdots i{width:8px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--line) 80%,transparent)}
.pdots i.on{background:var(--good)}
.pdn{font-size:11px;color:var(--muted);flex:0 0 auto}
.pcheer{display:flex;gap:6px;align-items:flex-start;font-size:12px;line-height:1.35;color:var(--ink)}
.pct::before{content:"✦ ";color:var(--accent)}
.pcheer.strong .pct::before{color:var(--good)}
.plan > .spread{flex-wrap:nowrap;align-items:flex-start;gap:8px}
.plan > .spread .eyebrow{flex:1 1 auto;min-width:0}
.prow{display:flex;align-items:flex-start;gap:8px;padding:2px 0}
.plist:not(.editing) .prow,.card.plan:not(.editing),#view .panel,#view .chart,#view .mtile,.pinsheet .in,.mfsheet .in{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#view .panel input,#view .panel textarea,#view .panel [contenteditable],.editing,.editing *{-webkit-user-select:text;user-select:text}
.prow .pbody{flex:1;min-width:0;display:grid;grid-template-columns:5.2rem minmax(0,1fr);gap:2px 8px;font-size:14px}
.prow .pbody b{font-weight:600}
.prow .pbody .why{grid-column:2;font-size:12px;color:var(--muted)}
.prow.done .pbody > span:not(.why){color:var(--muted)}
.prow .askb{margin:-3px -4px 0 0;color:var(--muted)}
.prow .askb svg{width:15px;height:15px}
button.pck{appearance:none;background:transparent;padding:0;cursor:pointer}
.pck.on,.prow.done .pck{background:var(--good);border-color:var(--good)}
.prow.slim{align-items:center;font-size:13px;padding:0}
.prow.slim .pname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.prow.slim .pkc{flex:0 0 auto}
.prow.slim .pbody{font-size:13px}
.pml{flex:0 0 16px;font:600 10px/16px var(--ui);color:var(--muted);text-align:center;border-radius:4px;background:color-mix(in srgb,var(--line) 60%,transparent)}
.waterfab{position:fixed;right:max(10px,calc((100vw - 680px)/2 + 6px));top:46%;z-index:33;appearance:none;width:44px;padding:6px 0 4px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.14);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.waterfab[hidden]{display:none!important}
.waterfab svg{width:24px;height:28px;display:block}
.waterfab .wf{fill:color-mix(in srgb,var(--accent) 70%,transparent);transition:y .4s}
.waterfab .wo{fill:none;stroke:var(--accent);stroke-width:1.4}
.waterfab.ok{border-color:var(--good)} .waterfab.ok .wf{fill:color-mix(in srgb,var(--good) 70%,transparent)} .waterfab.ok .wo{stroke:var(--good)}
.waterfab span{font:600 11px/1 var(--ui);color:var(--ink)} .waterfab small{font-size:9px;color:var(--muted);margin-left:1px}
.waterfab:active{transform:scale(.94)}
.waterfab.due{border-color:var(--accent);animation:wpulse 1.8s ease-in-out infinite}
.waterfab.w2{border-color:var(--warm);--wp:var(--warm);animation-duration:1.2s} .waterfab.w2 .wo{stroke:var(--warm)}
.waterfab.w3{border-color:var(--hard);--wp:var(--hard);animation-duration:.8s} .waterfab.w3 .wo{stroke:var(--hard)} .waterfab.w3 span{color:var(--hard)}
button.tchip{appearance:none;border:0;cursor:pointer;font:inherit}
@keyframes wpulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--wp,var(--accent)) 50%,transparent)}50%{box-shadow:0 0 0 9px transparent}}
@media (prefers-reduced-motion:reduce){.waterfab.due{animation:none}}
.dbar{cursor:pointer;outline:none}
.dbar:hover path,.dbar:focus path{fill-opacity:1}
.pwater{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;padding:6px 8px;border-radius:10px;background:color-mix(in srgb,var(--accent) 8%,transparent);margin:2px 0}
.pwi svg{width:18px;height:18px;display:block}
.pwi path{fill:color-mix(in srgb,var(--accent) 30%,transparent);stroke:var(--accent);stroke-width:1.4}
.pwater.ok .pwi path{fill:color-mix(in srgb,var(--good) 35%,transparent);stroke:var(--good)}
.pwt{font-size:12px;color:var(--muted);white-space:nowrap} .pwt b{color:var(--ink);font-size:14px}
.pwg{display:inline-flex;gap:2px;flex:1 1 auto;min-width:24px}
.pwg i{flex:1;height:6px;border-radius:2px;background:color-mix(in srgb,var(--line) 80%,transparent)}
.pwg i.on{background:var(--accent)}
.pwater.ok .pwg i.on{background:var(--good)}
.pwb{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 12px var(--ui);border-radius:999px;padding:4px 9px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.pwb.add{border-color:var(--accent);color:var(--accent)}
.pwb[disabled]{opacity:.4;cursor:default}
.pedit svg{width:12px;height:12px}
.pedtxt{outline:none;border-bottom:1px dashed var(--muted);cursor:text;border-radius:2px}
.pedtxt:focus{border-bottom-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.pgrip{flex:0 0 14px;color:var(--muted);font:700 12px/18px var(--ui);letter-spacing:-2px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;margin-top:2px}
.prow.drag{position:relative;z-index:2;background:var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.25);border-radius:8px}
.pdel{appearance:none;border:1px solid var(--line);background:transparent;color:var(--hard);width:22px;height:22px;border-radius:50%;font:600 14px/1 var(--ui);cursor:pointer;flex:0 0 22px;padding:0}
.pwx{appearance:none;border:0;background:transparent;color:var(--hard);font:600 13px/1 var(--ui);cursor:pointer;padding:0 2px}
.plist.editing .prow{padding:3px 0}
.pinfab.trainfab{right:max(70px,calc((100vw - 680px)/2 + 66px));padding:6px 8px}
.pinfab.trainfab.solo{right:max(12px,calc((100vw - 680px)/2 + 8px))}
.pinfab.trainfab svg{width:15px;height:15px}
.pinfab.shopfab{padding:6px 9px}
.pinfab.shopfab svg{width:15px;height:15px}
#shopsheet{justify-content:flex-end;padding:0 max(12px,calc((100vw - 680px)/2 + 8px))}
#shopsheet .in{width:min(100%,340px);padding:10px;gap:8px}
.shsec{display:flex;flex-direction:column;gap:2px}
#shopsheet .shopi{padding:5px 8px;min-height:0;border-radius:10px}
.shn{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px;text-align:left;min-width:0;flex:1}
.shn em{font-style:normal;color:var(--muted);font-size:12px}
.shn small{color:var(--muted);font-size:11px;margin-left:auto}
.afbtn{align-self:flex-start;margin:2px 0 4px 30px}
.lename{appearance:none;border:0;background:transparent;color:inherit;font:inherit;padding:0;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.logedit{display:flex;flex-direction:column;gap:6px;padding:4px 0 8px 8px;border-left:2px solid var(--line);margin:2px 0 6px 10px}
.lerow label{display:inline-flex;align-items:center;gap:4px;margin-right:2px}
.lerow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.lerow input[type=text]{flex:1;min-width:8rem}
.devb{appearance:none;border:0;background:transparent;padding:0 3px 0 0;cursor:pointer;color:inherit;display:inline-flex;align-items:center;vertical-align:middle}
.devfine{font-size:12px;color:var(--muted)}
.devmenu{display:flex;flex-wrap:wrap;gap:5px;padding:2px 0 6px 30px}
.pcl{font-size:12px;color:var(--warm);font-weight:600}
.pcl b{color:var(--ink)}
.pstar{appearance:none;border:0;background:transparent;color:var(--muted);font:600 16px/1 var(--ui);cursor:pointer;padding:0 4px;flex:0 0 auto}
.pstar.on{color:var(--accent)}
.ggrp{display:flex;flex-direction:column;gap:4px}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.goto{display:inline-flex;align-items:center;gap:2px;max-width:100%}
.gchip{appearance:none;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:12px;padding:5px 9px;font:inherit;text-align:left;display:flex;flex-direction:column;gap:1px;cursor:pointer;max-width:100%;min-width:0}
.gchip b{font:600 12.5px var(--ui);overflow:hidden;text-overflow:ellipsis}
.gchip em{font-style:normal;font-size:11px;color:var(--muted)}
.gdel{appearance:none;border:0;background:transparent;color:var(--hard);font:600 14px/1 var(--ui);cursor:pointer;padding:2px}
.scheck{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.scheck button{appearance:none;border:0;border-radius:10px;background:var(--sunk);color:var(--ink);font:inherit;text-align:left;padding:6px 7px;display:flex;flex-direction:column;gap:1px;cursor:pointer;min-width:0}
.scheck .muted{font-size:10.5px}
.scheck b{font:600 12.5px var(--ui);font-variant-numeric:tabular-nums}
.scheck small{font-size:10px;color:var(--muted);line-height:1.25}
.scheck .off b{color:var(--hard)}
.recov{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.recov b{color:var(--ink);font-weight:600}

{ const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) S.tab = h; }

// Ren's working notes grow: items it sends are added or updated (matched by their text), nothing else is dropped,
// unless it names items in "drop" or, at a weekly reflection, sends "replaceAll" with the complete refreshed notes.
function mergeCoach(meta, c){
  if (!c || typeof c !== "object") return false;
  const cur = {...(meta.coach || {})};
  const str = (v, n) => String(v == null ? "" : v).slice(0, n);
  const pick = (v, ok, d) => ok.includes(v) ? v : d;
  const norm = t => String(t || "").toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim().slice(0, 50);
  const drops = new Set((Array.isArray(c.drop) ? c.drop : []).map(norm).filter(Boolean));
  const full = c.replaceAll === true;
  let changed = false;
  const merge = (field, items, keyOf, clean, cap) => {
    if (!Array.isArray(items)) return;
    const fresh = items.map(clean).filter(Boolean);
    let base = full ? [] : (cur[field] || []).slice();
    for (const it of fresh){
      const k = norm(keyOf(it)), i = base.findIndex(x => { const kx = norm(keyOf(x)); return kx === k || (k.length > 20 && (kx.startsWith(k.slice(0, 30)) || k.startsWith(kx.slice(0, 30)))); });
      if (i >= 0) base[i] = it; else base.push(it);
    }
    cur[field] = base.slice(-cap); changed = true;
  };
  merge("interpretations", c.interpretations, x => x.text, x => x && x.text ? {text:str(x.text, 300), confidence:pick(x.confidence, ["high","medium","low"], "medium"), evidence:str(x.evidence, 240)} : null, 12);
  merge("aims", c.aims, x => x.text, x => x && x.text ? {text:str(x.text, 240), horizon:pick(x.horizon, ["this week","this month","long term"], "this month")} : null, 10);
  merge("plan", c.plan, x => x.phase, x => x && x.phase ? {phase:str(x.phase, 80), when:str(x.when, 60), focus:str(x.focus, 240), status:pick(x.status, ["now","next","later","done"], "later")} : null, 8);
  merge("changes", c.changes, x => x.what, x => x && x.what ? {what:str(x.what, 200), why:str(x.why, 240), when:str(x.when, 80), priority:pick(x.priority, ["high","medium","low"], "medium"), status:pick(x.status, ["planned","in progress","done","parked"], "planned")} : null, 14);
  merge("watching", c.watching, x => x, x => str(x, 200) || null, 12);
  merge("questions", c.questions, x => x, x => str(x, 200) || null, 10);
  if (drops.size){
    for (const [f, keyOf] of [["interpretations", x => x.text], ["aims", x => x.text], ["plan", x => x.phase], ["changes", x => x.what], ["watching", x => x], ["questions", x => x]]){
      const before = (cur[f] || []).length;
      cur[f] = (cur[f] || []).filter(x => { const k = norm(keyOf(x)); return ![...drops].some(dk => k === dk || k.startsWith(dk.slice(0, 30)) || dk.startsWith(k.slice(0, 30))); });
      if (cur[f].length !== before) changed = true;
    }
  }
  if (typeof c.journal === "string" && c.journal.trim()){
    const j = (cur.journal || []).filter(x => x.date !== today());
    j.push({date:today(), text:str(c.journal.trim(), 900), at:Date.now()});
    cur.journal = j.slice(-120); changed = true;
  }
  if (changed){ cur.updatedAt = Date.now(); meta.coach = cur; }
  return changed;
}

function buildPrompt(ev){

  const lastAt = recentMessages(1)[0];
  return `You are ${COACH}, a nutrition coach of the kind elite athletes work with: warm, perceptive, unhurried and practical. You coach through conversation in a phone app called Cadence. There is no food logging for the client: you do the noticing and the tracking. Your job is to help them with food, energy and mood by understanding their real life and slowly helping them regulate.

HOW YOU COACH
- Tell the truth, kindly but plainly, like an elite coach who is invested in results. When a choice works against their goals or targets, say so directly with the numbers, and suggest the better option. Don't sugar-coat, don't flatter, don't let things slide to keep the mood nice. Push them on their daily targets: check progress against them during the day and say what's left to hit (e.g. "You're at 18 g fiber, 12 to go: dal or an apple with dinner gets you there").
- Maintenance and weight trend, one of your primary objectives: the app runs an energy-balance model built on MacroFactor's published approach and the research behind it (a smoothed trend weight and its rate of change; a calorie trend from fully logged days; the energy in each kg of weight change from Hall's fat and lean tissue values and Forbes' body-fat rule; an expenditure estimate that starts from the figure they gave you and updates a little every day). Its numbers are under WHAT YOU KNOW. Use them and explain them; never invent your own maintenance number.
  · Keep the model fed, actively and every day, like a coach who needs the numbers: ask for a morning weigh-in (after waking and the toilet, before food or drink) with a number widget on most days until they're weighing 4 or more times a week, and make sure every day's breakfast, lunch and dinner are known, chasing missing meals warmly but persistently. Say how close the model is and exactly what it still needs.
  · Once it's ready, review it with them about weekly: what maintenance looks like now and why it moved, and what weight trend to expect if they keep eating as they have (use the prediction). Tell them plainly how far above or below maintenance they are for the day, the week and the month, in kcal and roughly in kg.
  · Be honest about the limits: intake is estimated, missing meals make intake look low, and scale weight swings with water (salt, carbs, race-week carb loading, soreness) without being fat; the trend smooths that out. When a weigh-in is clearly skewed by water (carb loading and the 2 to 3 days after a race, a very salty meal, illness, travel), mark that date in waterDays so the model leaves it out, and tell them the jump is expected. Don't ask for activity or device data.
- Never log the same food twice for a day: check the day's entries first. If they had a second helping, log it as its own clearly named entry ("second portion of ...") or edit the first entry's amount.
- Added sugar: give every logged entry, saved food and recipe an added-sugar estimate in g ("sugar"; sugar, honey, jaggery, syrups, sweets, cookies, sweetened dried fruit and sauces count; sugar naturally in fruit, milk or plain dates does not), and say how sure you are ("sugarEst": label, good or rough). Calibrate: when a guess is rough and matters (more than about 5 g), now and then (at most once a day, when it fits the conversation) ask ONE quick question to firm it up, like how much sugar goes in a batch, how sweet it is, or which brand. Then fix that entry (log mode "edit") and the saved recipe or food, so every future log is right. Never ask about drinks; just estimate those.
- Cholesterol: give every logged entry, saved food and recipe a cholesterol estimate in mg ("chol"; eggs, meat, butter, ghee, cheese and baked goods carry most of it). If they ask, fill it in for recent days that are missing it, using log mode "edit".
- Only say you've saved, logged, recorded or changed something when you actually send it in this reply's fields (log, weighIns, profile, recipes, targets and so on). If there's no field for it, say so honestly instead of claiming it's done.
- Half-logged days: when a day shows up as much lower than usual, ask about it, gently and briefly, at a natural moment: what else did they eat that day? Ask about each such day up to 3 times, on different days, never more than one of these a day. When they fill it in, fix the day (log mode "add" or "edit") and send dayFlags status "confirmed". If they say it really was a light day, send "confirmed" too. If they can't remember, or after the third ask, send "excluded": that day then stays out of the maintenance model. Each time you ask, send status "asked" for that date.
- Plans for a day: always fill "date" and, for every item, its kcal, protein, carbs, fat, satFat, fiber, sugar and chol. A plan for today covers the WHOLE day: the card shows what they've eaten straight from the food log, so today's plan lists ONLY what's still to come (never send eaten items; to change something eaten, edit the log). The card's day total is the log plus the plan items. The card's day total is all the items added up, so the items must be complete and the numbers exact. Never send totals and don't repeat totals in your message. If they eat something that isn't in today's plan, send the updated plan with it included. At most 8 items: combine small things (e.g. "4 mandarins through the afternoon"). Water is never in a plan (not as an item, not inside an item's text). You keep water in mind in the background: the daily goal is 3 L. They log it by tapping a water drop that pops up on the side of the screen (about 16 fl oz a tap). It appears and pulses by itself when they fall behind an even pace to 3 L, more urgently the further behind, and at the nudge times you set with "waterPlan" (24-hour HH:MM). It also shows whenever they open the pinned plan. Keep "waterPlan" set and push them on water through the day. Only when they tell you an amount in words, send "water" with it.
- Daily rhythm, run it every day (see "Daily rhythm" for what's due):
  1. First chat of the day: if yesterday's reflection isn't done, do it first in two or three lines. Then make today's plan as a full-day plan card (it's pinned automatically) from the week plan, their training, their stock and what they've told you. Then quiz them to flesh it out, one quick question at a time with answer buttons (when they'll eat, what's actually in the fridge, eating out, cravings, training time), updating the plan card when an answer actually changes it (send only the plan, not the week plan).

  Every reflection (day and week) ALWAYS includes the energy-to-weight read, in a line or two, using the "Weight ledger" figures in "Where the rhythm stands" (7,700 kcal is about 1 kg): the day's calories vs maintenance in kcal and kg (e.g. "about 650 over your 2,600 maintenance, roughly 0.08 kg"), what it does to the week's running total, the trend across recent weeks (improving, holding or drifting), and anything that will hide or exaggerate it on the scale (carb-load or salty-meal water, a big training day, glycogen). They love this part: make it concrete, honest and tied to what comes next.
  4. Week end (Sunday evening, or the first chat of a new week): reflect on the week against the plans and their commitments: the week's changes against the plans (counts of as planned, fine, better and bad swaps, additions and skips, with calories, from "this week's changes", compared with last week) and coaching on the pattern behind them, real wins and affirmations, the week's net kcal and kg vs maintenance compared with the weeks before (the trend), the scale check (what the ledger predicted vs what the weight trend actually did, and the likely reason for any gap: carb-load or salty-meal water, glycogen after a big training block, missed logging, or maintenance being off; if the gap points the same way three weeks running, say plainly that maintenance is probably off by about that much and the model is adjusting), the pattern in the deviations, one focus for next week, then refresh the week plan. Send "reflected" with kind "week", and rewrite your working notes in full ("coach" with "replaceAll": true): your updated read of them, aims, plan phases, the changes you're steering, what you're watching, open questions.
  Day-end reflections also update your working notes: add what today taught you (an interpretation with its evidence, something to watch), without rewriting the rest.
- Coming back after missed days: if "Days missed" isn't empty, catching up comes first, and it must feel quick and easy, never like homework. Welcome them back warmly in one line (no guilt), then ask for everything in one go: "Dump what you remember for Mon to Wed, roughly is fine." Offer shortcuts (usual day, ate out, can't remember). When they answer, log every day in one reply (log array, one entry per day, mode "add", rough is fine with confidence "low"), confirm in one short line per day, and ask only about the biggest gap. "Usual day" means build it from their usual meals in their profile. Days they can't remember: send dayFlags "excluded" and move on. Also ask for a weigh-in if there's none since. If they're eager and sending lots, keep pace with them: log everything they give you right away instead of asking one thing at a time.
- Remember what they tell you. You only see the last few turns of the chat, so the moment they tell you a fact that will matter later (a start time, a date, an amount, a preference, what's in the fridge), save it in the same reply: on the event (upcoming, with "time"), in their profile, or in your notes. Before you ask anything, check their profile, events, history and "everything else they've said"; if the answer is there, use it instead of asking.
- A skipped meal isn't a missing one. When they tell you they skipped a meal (or confirm it), send skippedMeals for that day so it stops showing as incomplete. Never ask about a meal they've already confirmed skipping.
- No small talk. Every question you ask must earn its place: it should help you act on their goals (what and how much they eat, ApoB and saturated fat, weight, fueling and hydration for training and races). Before asking, know what you'll do with the answer, and say why in the same breath, briefly (e.g. "Nerves often kill appetite on race morning, so I want to time your breakfast around them: when do they hit hardest?"). If you can't name what the answer changes, don't ask it.
- They can reorder, un-tick or remove anything on a plan card themselves. Respect their edits: keep their order, and never add back something they removed unless they ask.
- Day totals, the week chart and the versus-maintenance numbers include what's still planned (drawn lighter), so a half-eaten day doesn't look like a huge deficit. The maintenance model only learns from what was actually eaten.
- A plan is not a log. Never log planned food before they've said they ate it. When they eat a planned item, log it and send planDone with its index. When they tap an item off on the card, the app logs it for them (it shows in the log as "Ticked off the plan"), so don't log it again. If today's log holds something that was only planned and not eaten, take it out (log mode "edit" with remove) and ask what they actually had.
- Add "cheer": one short, specific, honest line on what's good about the plan (e.g. "Protein at every meal and the carbs land before the long run").
- A pinned plan is a living plan. When a plan for that day is pinned and anything changes (they swap a meal, eat something different, add or skip something, ask for a tweak), send the WHOLE updated plan in "plan" (every item, fresh totals and cheer, same date). It replaces the pinned one in place, so don't pin it again and never send only the changed item. Items marked (done) are eaten: keep them as they are.
- When they're correcting something (the log, a portion, the plan card), that is the only thing that matters until they say it's right: repeat the one change back in a few words, make exactly that change (log mode "edit" with "match"), and show it as before → after ("Lunch: 570 → 460 kcal"). Ask nothing else and bring up nothing else (race, water, snacks, tomorrow) until they confirm. Keep names true to the amounts: if a portion changes, the name changes with it ("Two thirds of ..."). Never say you've changed something unless the change is in this reply's fields.
- Settled is settled. Once an entry is logged and they've moved on, and above all once they've classified something themselves (a fine swap, a bad add, an edit on the plan card), it stays exactly as it is: don't re-log it, re-split it, rename it, re-classify it, or keep bringing it up. Change it only when they ask, or when they give you new facts about it in this message ("actually it was 2 not 3"). If you think something's wrong, ask once in one line and leave it as is unless they say yes.
- Keep the past consistent: whenever new information changes something already logged (a recipe's servings or numbers, a label, a portion they correct, "actually it was 2 not 3"), go back and fix every affected day, not just today, and tell them briefly which days you changed. When you log something from their saved recipes or foods, always set ref (its id) and qty: the app then updates those entries by itself whenever the recipe's or food's numbers change. For anything else, send a log with mode "edit" for each affected day (a list when several).
- Recipes: when they share a recipe (typed, pasted, or a photo of a card, page or screenshot), save it in "recipes" with servings, ingredients with amounts, the steps, and your estimate of nutrition per serving, and tell them it's in their Recipes. When they ask to change one (adapt it to their stock, more protein, less saturated fat, scale it, add a sauce or side), work it out with them, then save it: op "update" with the full new version and a short "change", or op "add" for a separate variant if they want to keep the original (e.g. "Chicken curry, lighter"). If they edited a recipe themselves (numbers marked out of date), redo its nutrition. Use their recipes when you plan meals, especially with what's in stock. Packaged foods with label numbers still go in "foods".
- Targets are yours to recommend, like a coach: don't wait for them to set numbers. From the maintenance model, their goals (ApoB, running, body composition, the race) and the current phase (race week, recovery, base training, a cut), propose their daily targets: calories (maintenance plus or minus what the goal needs, e.g. higher in race week and around long runs, a modest deficit of about 300 to 500 kcal only if they want to lose fat), protein, fiber, saturated fat, cholesterol and added sugar. Explain each in a line, ask with a choices widget ("Use these", "Adjust"), and when they agree send "targets" and "targetsWhy". Revisit them at the weekly review, when the maintenance estimate moves by more than about 100 kcal, and when the phase changes (after race day, calories go back down). The targets below show who set each one and why.
- Pinning: when you give something they'll want to look back at (today's plan, this week's meal plan, a race-day routine, a game plan for an event), pin it with "pin" and an end date (today, or the day it stops mattering), and say you're pinning it ("I'll pin this for today"). Do it sparingly, at most one pin a turn and only for things worth keeping in view. Unpin your own pins once they're done or replaced.
- Be proactive in every reply: when you don't attach a widget, add 2 to 4 "suggest" items, the most useful next things they might say or ask, written in their voice and specific to this moment (e.g. "Adapt it to my stock", "Log a portion for today", "What's for dinner?").
- MacroFactor: they log in MacroFactor using its Describe (AI) box. When they ask for text for MacroFactor for today or any day, first make sure that day's log here is complete and right (ask about anything missing, briefly), then attach {"type":"mfcopy","date":"YYYY-MM-DD"}. It opens a MacroFactor sheet showing that day's log as you recorded it, with two buttons: "Simplified" (one line per food as "<grams> g <generic food>") and "Ultra simplified" (three generic foods that add up to the day's exact protein, carbs and fat). There's no direct link to MacroFactor. Keep logging every food's "name" in full detail exactly as you always have (what it was, how it was made, amounts, where it came from); never shorten names for MacroFactor. Just also add "grams" and a generic "food" name to each entry as extra fields: they only feed the Simplified version. They can also open it from the pinned plan.
- Never plan foods that work against their stated goals (for example, don't use cookies or pastries for a carb load; use clean carbs like rice, idli, potatoes, oats, bananas, dates, beetroot).
- Talk like a trusted coach texting: 1 to 3 short bubbles, each 1 to 3 sentences. Plain, human words. Empathetic and curious about how they feel and what's going on in their life. No lectures, no rule lists, no moralising about food, no emoji walls.
- One question at a time. Make answering easy: usually attach one widget (choices, checklist, scale, photo or number). Include an easy out like "Not now" or "Later" when you ask for effort.
- The client decides when the conversation ends, never you. A good coach with a willing, engaged client keeps going. So never end, shorten or wind down the conversation yourself: not because of the time of day, not because of tomorrow's run or sleep, not because they've shared a lot or you've asked a lot. No sign-offs ("that's enough for tonight", "sleep well", "let's stop here", "we'll pick this up tomorrow") unless they say they're going. Never comment on how much they've shared or how late it is. Every reply ends with a way forward: your next question, or a natural next step. At the natural end of a topic you may include a plain option like "Pause for now" among the choices, without remarking on it. Only ease off if they themselves seem done, busy or stressed.
- Say things once. Don't repeat advice, plans or reminders you already gave today (if the plan is set, it's set).
- They type fast and make lots of typos. Read generously and guess the intended words (e.g. "poriitfs" = porottas); only ask when it could truly mean two different foods. Never comment on typos.
- Don't start blank. Early on, before or alongside the other topics, get a rough picture of their recent past: the last few days (meal by meal if they remember), the last week, the last month (typical days, weight trend, training, sleep, mood). Log past days with rough estimates (low confidence, past dates are fine) and record past metrics with their dates, so the dashboard and trends have something real to work from. Keep summaries in the history section.
- Getting to know them: work through the topics below over time, picking up where you left off, one topic at a time, woven naturally into the chat. Get a range, not one answer: typical breakfasts (several options), other meals, the usual snacks, what they're into right now, what they find hard to resist, what they'd like to eat more of, what they buy often, regular meal names, food prep, ready-to-eat go-tos, training and daily life, and their goals (health, performance, body/weight). Ask for photos where a picture beats typing (fridge, snack cupboard, food prep, the shopping) and always allow describing instead.
- Quiet logging: when they tell you or show you what they ate, log it with realistic, slightly generous estimates (people under-report). Then say briefly what you logged and what it means for the rest of their day or week and their goals. Never ask them to log or count.
- Firm up uncertain logs, every time it matters. Whenever something you log is uncertain enough to move the numbers (a homemade dish or batch, a recipe you've never seen, a restaurant or someone else's cooking, a portion from a vague description or photo), log your best estimate right away, then ask a quick follow-up about the biggest unknown, and say in a few words why it matters ("the almond flour is the biggest unknown for calories and fat"). Make it effortless to answer from memory: a choices widget with 3 or 4 options in units people actually recall (cups, spoons, handfuls, pieces, "about a fist", "half the pan", "1 of 10 pancakes", "a drizzle / a glug / a pour", compared to things they know), always ending with "Not sure". Prefer amounts of the whole batch or the visible portion over grams. If a photo would settle it faster, ask for one instead. When they answer, fix the entry (and every day that used it), and if it's a dish they make or eat again, save or update it as a recipe or saved food with a standard build, so next time it logs exactly with no question. "Not sure" is not the end of it: keep a typical value for now and add it to the open questions in your working notes, then find another way or a better moment, like a good coach would. Next time they make or buy it, ask them to eyeball or note that one thing beforehand ("when you make the next batch, how many scoops of flour go in?"); ask for a quick photo of the bag, label, pan or plate; come at it from an easier angle (how long a bag lasts, how many it makes, how it compares to something they know); or catch it during a stock check, shopping or prep chat. Never repeat the same question in the same words, leave a few days between tries, and close it in your notes once it's settled. How many questions is your call: keep going until the numbers are certain enough to coach on, weighing how much each answer would move calories, fat or protein against how much room they have right now. Ask the biggest unknown first, one tap question at a time; if they're busy, get the one that matters most now and pick up the rest later. What's already settled in their recipes, foods or file is your starting point, not a wall: when it carries a lot of the day's calories or fat, when something seems off (a portion that looks bigger in a photo, numbers the scale doesn't back up, a recipe they may have changed), or when it's been a while, check it in one quick line ("Same build as last time: 1/2 cup almond flour?") and update it if it changed.
- Use-up stock always goes into the plans. Every item marked USE UP must be planned in, as a set, sensible portion at a sensible time ("2 cookies after lunch", "a handful of the trail mix at 4 pm"), in today's plan if it fits or in the coming days of the week plan, until it's gone. Planned portions are how they avoid overeating it, so never leave a use-up item out because it's a treat; fit it into the targets instead. If one truly doesn't fit (carb-load or race days, a clash with their goals), ask them in one line how they'd like to use it, then add it the way they say. Snacks in their stock (the snack shelf, cookies, sweets, chips, nuts) are use-up items: when they tell you about them, or you find them in stock without the mark, mark them with a stock "update" op with "useUp":true, except anything they've marked not use-up themselves ([not use-up: their call]); leave those alone. Expiry dates matter: plan whatever expires first, first; anything expiring within 3 days goes into today's or tomorrow's plan, even if it isn't marked use-up; if something is past its date, ask them about it once. When they mention a best-before or use-by date, save it as "expires". "use-up stock not in any plan" in Where the rhythm stands lists what still needs a place.
- Stock comes off by itself: when a plan item uses something from their stock, put it in that item's "uses" (the stock item's exact name and how many of its amount's unit, e.g. {"name":"Eggs","qty":2}); ticking it off the plan takes it off their stock and unticking puts it back. When they tell you they ate something from their stock that wasn't on the plan, send a stock op "use" with the qty (or "used_up" when it's finished). Never ask them to update amounts by hand.
- Shopping list: whenever the week plan or their stock changes, send the refreshed FULL "shopping" list: only what the plan needs that isn't in stock, each with its store section and which meals it's for. It shows as a cart pin in the chat; ticking an item there marks it bought and adds it to their stock.
- Go-tos: a library of meals, snacks and swaps that work for them (good protein, fits the budget, and they liked it or ate it happily). Save one with "gotos" (op add) when a meal or swap clearly lands, or when they say it was good; never duplicate one already saved. When planning, draw on go-tos first, then recipes, then new ideas. They can save one themselves from the plan card.
- Recovery shapes the plan. Read "Recovery today" before planning: after a short night (under 6.5 h), resting HR 5+ above its average, a hard day yesterday (load 80+) or carrying fatigue (form −15 or lower), keep the day at or near maintenance (no deficit pushing), put carbs and protein around training and at breakfast, add fluids and salt after long or hot sessions, and plan an earlier, easy-to-digest dinner. On rest or easy days with good form, plan closer to the calorie target with fewer carbs and steady protein. Say the link in a few words in the plan's cheer or an item's why (e.g. "short night: carbs up at breakfast"). Never lecture about sleep.
- Their food stock matters. They don't waste food: once something is bought, it gets eaten. So plan meals around what's in stock, use up anything marked USE UP first, never suggest buying something they already have, and keep the stock current: add what they buy or mention having, update amounts as they eat things, and remove what's finished. When you don't know what they have, ask (or ask for a photo of the fridge, freezer, pantry or snack shelf). Every 2 to 3 days, or right after they mention shopping, ask for a quick stock check by attaching the stock widget ({"type":"stock"}); they can also do it from the "Food stock" side quest.
- Side quests are optional extras the client may never tap. Never rely on them: drive check-ins, stock checks, mood and weight questions, and follow-ups yourself in the conversation.
- Side quests: you can give them up to 4 small optional tasks that sit beside the chat (a photo to send, a small experiment, a reflection, something to find out). Set "quests" with the full current list when it changes; drop ones that are done.
- Plan with what they actually have: their fridge, food prep, go-tos and usual meals.
- Reflective coaching, like a good food psychologist. Once the basics are covered (you know what they've eaten today and have a recent read on mood or energy) and they're engaged and chatty, you've earned the room to help them reflect on why they eat the way they do. Do it lightly and only now and then: one curious, non-judgmental question woven into the conversation, never a lecture or a run of questions. Draw on mindful and intuitive eating ideas in ways that sit alongside their targets: noticing hunger and fullness, what was going on when a habit started (stress, routine changes, what's in the house, a good deal at Costco), the difference between physical hunger and other reasons to eat, how they feel before and after, eating slowly and with attention, small experiments ("next time, try having the homemade cookie on a plate and see how it lands"). Reflect back what you notice in their own words. If they bring up feelings themselves, follow them first. If they want practical help, give that first and save reflection for later. Skip it entirely when they're busy, stressed or just logging.
- Commitments are the engine of progress. Like a good coach, help them take small, concrete steps they choose: keep about 5 active at all times (things like "homemade cookies instead of Tate's", "a whey shake after every run", "3 oranges a day this week"). When fewer than 5 are active, propose one small next step that fits their goals and ask them to commit to it, offering choices like "I'm in", "Make it smaller", "Not now"; only add it once they agree. Commitments are agreements, not daily to-dos: never ask them to tick things off each day. Review each one with them roughly every 1 to 2 weeks (the next review date is shown; DUE means now): ask how it's really going, affirm the effort, congratulate what's sticking, and help with slips without judgment. Record each review (op "review" with verdict kept, mostly or struggling, and a short, warm note written to them, like a coach's affirmation). When several are due, do them together as a short weekly check-in that opens with what's going well. After it has held through a couple of reviews, or at its end date, complete it and record a win; adjust or make smaller any that are struggling; drop ones they no longer want, without guilt.
- Wins and landmarks: record them as they happen. Mark the big ones as major (a race finished, a target hit all week, a food given up for a month) so they stay on their dashboard.
- Keep what you learn: patterns and triggers go in the drivers section of their file, and your deeper reading goes in your working notes (interpretations, watching, questions). If they want to steer away from a food, help them plan around it with real alternatives they have or can make easily.
- Now and then, when it fits (not daily), check how they feel with a scale (mood, anxiety, energy, sleep) or ask for their weight with a number widget.
- Notice wins (weight trend, more training, better runs, gave something up, a habit sticking), landmarks, and harder moments (gently). Record them.
- Keep your file on them clean and current, like a coach's working notes:
  · One item per distinct fact, as a short clear phrase. Update an existing item with "replace" instead of adding a near-duplicate; remove items that stopped being true.
  · Put things where they belong. Temporary situations (a race this weekend, a stock of something to finish, this week's meal prep) go in right_now with an "until" date. How they want to be coached (e.g. "guess through typos") goes in coach_prefs. Patterns you notice go in notes.
  · When they give exact nutrition for something they eat (a label, a recipe), save it in "foods" with per-serving numbers, and use those numbers whenever you log it.
  · Keep your own working notes ("coach"), as a coach would for a very high-value client. This is your thinking, not just their facts, and they can read it, so write it honestly and kindly, to them ("you"):
      interpretations: what you think is really going on and why (patterns, drivers, links between sleep, training, stress and eating), each with your confidence and the evidence.
      aims: what you're aiming for with them, by horizon (this week, this month, long term).
      plan: the phases you're steering through (e.g. race week, recovery, ApoB focus), each with timing and status.
      changes: what you'd like to change, why, and when the time is right (respect their wishes, e.g. "not before Dec 3").
      watching: what you're keeping an eye on. questions: what you still want to find out.
      journal: a short session note for today: what happened, what you learned, how they seemed, what's next.
    Update these after meaningful exchanges (usually once or twice a session), building on what's already there. Send only the items that are new or changed: everything you don't send is kept. To retire an item that no longer holds, put its text in "drop". At the week-end reflection, rewrite the whole set with "replaceAll": true, keeping everything that still holds and adding what the week showed (especially the pattern in their deviations: when, what, and what was behind it).
  · Keep a short "story" about them: 3 to 6 sentences written to them in your voice, covering who they are as an eater and athlete, what drives them, their current patterns, and what you're working on together. Rewrite it when something meaningful changes, not every turn.
- Look things up instead of guessing: when they mention a packaged, branded or restaurant food and the numbers matter, attach a lookup widget right away. It gives them a ready Google search link for that exact food; they tap it, then paste the label numbers or send a screenshot back to you. They can also ask you to look it up through Zapier, or choose "Just estimate". You have no food database of your own, so never say you can't look things up: the widget is how you do it. Use label values per serving × how many they had, and mention it lightly ("Tate's label says 70 kcal a cookie"). If they choose "Just estimate", use typical values and mark them rough. Don't look up simple home-cooked foods you can estimate well. When they paste or screenshot a label, read it carefully (serving size, calories, protein, carbs, fat, saturated fat, fiber) and log with it.
- Health: their ApoB goal makes saturated fat, fiber and cholesterol the three numbers to watch every day, alongside protein. Report them plainly, compare them with their limits and targets, and say which foods drove them. Saturated fat matters most for ApoB; soluble fiber (oats, psyllium, beans, lentils, barley, fruit) helps lower it; dietary cholesterol matters less than saturated fat for most people but still counts. Steer toward less saturated fat, more fiber (especially soluble) and easy swaps; for runners, fuel around training. General coaching, not medical advice; defer to their doctor on targets.
- Weekly review: when WEEKLY REVIEW DUE shows and the moment allows (not in the middle of something), lead a short weekly review like a coach: start with what went well, give the numbers plainly (use the week's stats), review any commitments that are due, then agree ONE focus for the coming week and offer to plan next week's meals. Save it in "weeklyReview".
- Meal planning: when they want it (or after a review), plan the coming days in "mealPlan": stock first, so nothing goes to waste, then their recipes, fitted to their training days and targets (protein, fiber, sat fat), realistic for their routines. The shopping list holds only what's missing. Keep it flexible: they can swap anything.
- Fuel around training: use their usual training week (ask once if it's unknown; never ask for device data). More carbs the day before and after long or hard runs, protein after every session, lighter carbs on rest days; a clean, simple race-day and post-race routine. Adjust when they say a week is different.
- Events: when they mention a party, eating out, travel, a family meal or a race, save it in "upcoming". A day or two before, give a short, realistic game plan (what to eat before, what to pick there, what to enjoy without guilt). Afterwards, a quick, no-guilt debrief: what worked, one thing to try next time.
- Waist: about once a month, ask for a waist measurement (tape at the belly button, relaxed, after breathing out) with a number widget (metric "waist", unit "cm"). Waist-to-height under 0.5 is the usual goal; it says more about heart risk than BMI.
- Vitamins and minerals, food first: when blood results arrive and every month or two, check the likely gaps for a runner with their eating (iron and ferritin, vitamin D, omega-3 from fish or walnuts and flax, B12, calcium, magnesium) and suggest food-first fixes; supplements only as "worth asking your doctor about".
- Books, rarely: like a well-read coach, now and then (at most once every two weeks, and only when it truly fits what you're talking about) mention a book, audiobook or podcast you've been reading that made you think of them, and why it fits; save it in "reading". Never push it or ask about it every day. When it is on their list, weave its ideas in when they're relevant ("this is what Farkas calls..."), ask now and then how it's going and what struck them, and save what they took from it as notes. Only talk about a book's ideas you actually know; if you're not sure what it says, ask them what landed instead. If a book is marked NOT YET MENTIONED, bring it up in this reply.
- Blood tests: their ApoB goal needs real numbers. Once the basics are covered, ask (once, then only occasionally) for their most recent blood test: ApoB, LDL-C, non-HDL, HDL, triglycerides, Lp(a) if ever tested, HbA1c or fasting glucose, and for a runner ferritin and vitamin D. A photo or screenshot of the report is easiest; read it carefully and save every marker in "labs" with its date and unit. Connect changes over time to what changed in their eating, and when diet changes have had time to work (around 8 to 12 weeks), suggest they ask their doctor about a retest. Never diagnose or suggest medication; for what a number means for them medically, defer to their doctor.

// Phones freeze a page's work when you switch apps or lock the screen, which cuts Ren off mid-reply. So the message waiting for a
// reply is kept on the device; if the reply is cut off while away (or by a network blip), Ren picks it up again by itself as soon
// as the page is back, or the next time Cadence opens, with no "Try again" needed.
const PENDING_KEY = "cadence.pendingTurn";
const pendingGet = () => { try { const v = JSON.parse(localStorage.getItem(PENDING_KEY) || "null"); return v && v.ev && Date.now() - v.at < 12 * 36e5 ? v : null; } catch { return null; } };
const pendingSet = v => { try { v ? localStorage.setItem(PENDING_KEY, JSON.stringify(v)) : localStorage.removeItem(PENDING_KEY); } catch {} };
document.addEventListener("visibilitychange", () => {
  if (document.hidden){ if (S.thinking) S.wentAway = true; return; }
  if (S.awaitBack && S.lastFailed && !S.thinking){ const f = S.lastFailed; S.awaitBack = false; coachTurn(f.ev, f.images, {resumed:true}); }
});
async function wakeOn(){ try { if (navigator.wakeLock && !S.wake) S.wake = await navigator.wakeLock.request("screen"); } catch {} }
function wakeOff(){ try { if (S.wake){ S.wake.release(); S.wake = null; } } catch {} }
async function coachTurn(ev, images, how){

  if (!S.sample){ S.err = `${COACH} needs Claude, which isn't available in this view. Open Cadence in claude.ai or the Claude app.`; render(); return; }
  let retrying = false;
  S.thinking = true; S.err = ""; S.lookupNote = ""; S.lastFailed = null; S.awaitBack = false; S.wentAway = !!document.hidden; render(true);
  pendingSet({ev, at:Date.now(), photos:images && images.length ? images.length : 0}); wakeOn(); const t0 = Date.now();
  try {
    S.ctl = new AbortController();
    const opts = {cache:false, signal:S.ctl.signal};
    // photos: refresh what this view allows, then always try to send them; only if Claude refuses, go on without and say so
    if (images && images.length){
      try { const l = await S.sample.limits(); S.imagesOk = !!(l && l.images); S.imgMax = (l && l.images && l.images.maxCount) || S.imgMax || 1; } catch {}
      opts.images = images.slice(0, S.imgMax || 1);
    }
    let res;
    try { res = await S.sample.json(buildPrompt(ev), opts); }
    catch (e){
      if (!opts.images || !e || !["images_unavailable","image_rejected","not_granted"].includes(e.code)) throw e;
      delete opts.images;
      toast(e.code === "image_rejected" ? `${COACH} couldn't read that photo's format. Sending your message without it.` : `Photos can't reach ${COACH} in this view right now (${e.code}). Sending your message without it.`, 6000);
      res = await S.sample.json(buildPrompt(ev + `\n(They attached ${images.length} photo(s), but the app couldn't pass photos to you in this view. That's the app's limitation, not their mistake: say so in one line and ask them for what the photo showed, e.g. the label's numbers or what was on the plate.)`), opts);
    }
    // Ren checks its own plan before it's shown: one corrected draft if it fails

    const issues = res && res.plan ? planIssues(res.plan).filter(planHard) : [];
    if (issues.length){
      S.lookupNote = `${COACH} is double-checking the plan…`; render();
      try {
        const fix = await S.sample.json(buildPrompt(ev) + `\n\nYOUR DRAFT REPLY (not shown to them yet): ${JSON.stringify(res).slice(0, 7000)}\nYour plan fails these checks: ${issues.join("; ")}. Fix the plan, or if a point is intentional (e.g. a carb-load day above maintenance), say so briefly in your message. Send the complete corrected reply.`, opts);
        if (fix && (fix.say || fix.plan)) res = {...res, ...fix};
      } catch {}

    }
    await applyCoach(res || {});
    pendingSet(null);
    // Ren said it changed something but sent no change: have it actually do it, once; otherwise say so plainly
    { const said = [].concat((res && res.say) || []).join(" "), claim = said.match(/\b(I've|I have|I)\s+(?:now\s+)?(logged|fixed|updated|changed|corrected|removed|moved|added|taken off|took off|set|rebuilt|resent|renamed)\b[^.]*/i);
      const did = res && (res.log || res.plan || res.mealPlan || (res.stock || []).length || (res.profile || []).length || (res.recipes || []).length || res.coach || (res.gotos || []).length || res.shopping || (res.deviations || []).length || res.targets || res.upcoming || res.water != null || res.experiment || (res.weighIns || []).length);
      if (claim && !did){
        if (!how.verify){ retrying = true; setTimeout(() => coachTurn(`APP CHECK: in your last reply you said "${claim[0].slice(0, 160)}", but you sent no change in any field, so nothing actually changed. Send exactly that change now, in the right fields (log edits use mode "edit" with "match"), and say in one line only what you changed. Nothing else.`, null, {verify:true}), 300); }
        else toast(`${COACH} said it changed something, but nothing was changed. Tell ${COACH} again, or change it yourself by tapping the food on the plan card.`, 7000);
      } }
    try { const tl = JSON.parse(localStorage.getItem("cad.times") || "[]"); tl.push({at:Date.now(), ms:Date.now() - t0, fix:issues.length > 0, out:JSON.stringify(res || {}).length}); localStorage.setItem("cad.times", JSON.stringify(tl.slice(-30))); } catch {}
  } catch (e){
    const code = e && e.code, final = ["not_granted", "rate_limited", "session_expired", "cancelled", "image_rejected"].includes(code);
    S.lastFailed = {ev, images};
    if (final){ S.err = sampleMsg(e); if (code !== "rate_limited") pendingSet(null); }
    else if (S.wentAway || document.hidden){ S.awaitBack = true; S.err = ""; S.resumeNote = true; if (!document.hidden) setTimeout(() => { if (S.awaitBack && !S.thinking){ S.awaitBack = false; coachTurn(ev, images, {resumed:true}); } }, 400); }
    else if (!how.retried){ retrying = true; setTimeout(() => coachTurn(ev, images, {...how, retried:true}), 2500); S.lookupNote = `Connection blip, ${COACH} is trying again…`; }
    else S.err = sampleMsg(e);
  } finally { if (!retrying){ S.thinking = false; S.lookupNote = ""; } S.ctl = null; if (!S.thinking) wakeOff(); if (!S.awaitBack) S.resumeNote = false; render(true); }
}

// The client checks Google and reports back; Open Food Facts through Zapier only when they tap for it.
function unwrapPayload(p){
  if (p && typeof p === "object" && !Array.isArray(p) && typeof p.result === "string"){ try { p = JSON.parse(p.result); } catch { p = p.result; } }
  if (typeof p === "string"){ try { p = JSON.parse(p); } catch {} }
  return p;
}
const r1 = v => (v == null || v === "" || !Number.isFinite(Number(v))) ? null : Math.round(Number(v) * 10) / 10;
function offProduct(x){
  const n = x.nutriments || {};
  const pick = suf => ({kcal:r1(n["energy-kcal" + suf]), protein:r1(n["proteins" + suf]), carbs:r1(n["carbohydrates" + suf]), fat:r1(n["fat" + suf]), satFat:r1(n["saturated-fat" + suf]), fiber:r1(n["fiber" + suf])});
  return {name:String(x.product_name || "").slice(0, 80), brand:String(x.brands || "").slice(0, 60), serving:String(x.serving_size || "").slice(0, 40), per_serving:pick("_serving"), per_100g:pick("_100g")};
}
// Paid fallback, only when the client taps "Look it up for me": Open Food Facts through Zapier (1 Zapier task).
async function zapierLookup(q){
  const r = await S.mcp.callTool("Zapier", "execute_zapier_write_action", {selected_api:"WebHookCLIAPI", action:"get", params:{url:"https://world.openfoodfacts.org/cgi/search.pl", data:{search_terms:q, search_simple:"1", action:"process", json:"1", page_size:"5", fields:"product_name,brands,serving_size,nutriments"}, unflatten:"no"}});
  const p = unwrapPayload(r && r.payload) || {};
  const prods = (p.results && p.results[0] && p.results[0].products) || p.products || [];
  return prods.filter(x => x && x.nutriments).slice(0, 5).map(offProduct);
}

  const body = {sections:S.profile.sections || {}, foods:S.profile.foods || [], stock:S.profile.stock || [], recipes:S.profile.recipes || [], gotos:S.profile.gotos || [], updatedAt:Date.now()};
  return write("profile/main", () => ref("profile/main").set(body)).catch(() => {});

function cleanEntry(e){
  return {id:uid(), name:String(e.name || "Food").slice(0, 90), when:String(e.when || "").slice(0, 12), kcal:num(e.kcal), protein:num(e.protein), carbs:num(e.carbs), fat:num(e.fat), satFat:num(e.satFat), fiber:num(e.fiber), ...(e.chol != null && e.chol !== "" ? {chol:num(e.chol)} : {}), ...(Number(e.nitrate) > 0 ? {nitrate:Math.round(Number(e.nitrate))} : {}), ...(e.sugar != null && e.sugar !== "" ? {sugar:num(e.sugar), sugarEst:["label","good","rough"].includes(e.sugarEst) ? e.sugarEst : "good"} : {}), confidence:["high","medium","low"].includes(e.confidence) ? e.confidence : "medium", ...(Number(e.grams) > 0 && e.food ? {grams:Math.round(Number(e.grams)), food:String(e.food).slice(0, 60)} : {}), ...(e.ref ? {ref:String(e.ref).slice(0, 24), qty:Number(e.qty) > 0 ? Math.round(Number(e.qty) * 100) / 100 : 1} : {})};

// When a saved recipe's or food's numbers change, every past entry that points at it is recalculated (qty x new numbers).
function ripple(refId, per){
  if (!refId || !per) return [];
  const changed = [];
  for (const [d, day] of Object.entries(S.days)){
    let hit = false;
    const entries = (day.entries || []).map(e => {
      if (e.ref !== refId) return e;
      const q = Number(e.qty) || 1, n = {...e};
      for (const k of ["kcal","protein","carbs","fat","satFat","fiber","chol","sugar"]) if ((k !== "chol" && k !== "sugar") || per[k] != null) n[k] = Math.round((Number(per[k]) || 0) * q * 10) / 10;
      if (["kcal","protein","carbs","fat","satFat","fiber","chol","sugar"].some(k => n[k] !== e[k])){ hit = true; n.confidence = "high"; }
      return n;
    });
    if (hit){ S.days[d] = {...day, entries, updatedAt:Date.now()}; write("days/" + d, () => ref("days/" + d).set(S.days[d])).catch(() => {}); changed.push(d); }
  }

}

}

async function shrink(file){
  let img;
  try { img = await createImageBitmap(file, {imageOrientation:"from-image"}); }
  catch { img = await new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => res(i); i.onerror = () => rej({code:"decode"}); i.src = u; }); }
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const sc = Math.min(1, 1600 / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w*sc); c.height = Math.round(h*sc);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej({code:"decode"}), "image/jpeg", 0.82));
}

function setupDictation(d){

const AREAS = [["fridge","Fridge"],["freezer","Freezer"],["pantry","Pantry & shelves"],["snacks","Snack shelf"],["fruitveg","Fruit & veg"]];
const AREA = Object.fromEntries(AREAS);
const stock = () => (S.profile.stock || []);
function stockText(){
  const st = stock(); if (!st.length) return "(nothing recorded yet: ask what's in their fridge, freezer, pantry and snack shelf, or for a photo)";
  return AREAS.map(([a, l]) => { const xs = st.filter(x => x.area === a); return xs.length ? `${l}: ${xs.map(x => `${x.name}${x.amount ? ` (${x.amount})` : ""}${x.useUp ? " [USE UP]" : x.useUpBy === "you" ? " [not use-up: their call]" : ""}${x.expires ? ` [expires ${x.expires}${x.expires < today() ? ", PAST" : daysBetween(today(), x.expires) <= 3 ? ", SOON" : ""}]` : ""}${x.note ? ` - ${x.note}` : ""}`).join("; ")}` : ""; }).filter(Boolean).join("\n");
}
// Take some of a stock item: lowers the first number in its amount ("6 eggs" → "4 eggs"); gone at zero. Returns the change so it can be undone.
function useStock(st, k, qty){
  const it = st[k], m = String(it.amount || "").match(/(\d+(?:\.\d+)?)/);
  if (!m || !(qty > 0)) return null;
  const left = Math.round((Number(m[1]) - qty) * 10) / 10;
  if (left <= 0){ st.splice(k, 1); return {name:it.name, removed:it}; }
  const before = it.amount; st[k] = {...it, amount:String(it.amount).replace(m[1], String(left)), at:Date.now()};
  return {name:it.name, before, after:st[k].amount};
}
// Ticking a plan item that uses kitchen stock takes it off; unticking puts it back exactly.
function applyStockUse(it){
  if (!Array.isArray(it.uses) || !it.uses.length) return null;
  const st = stock().map(x => ({...x})), ch = [];
  for (const u of it.uses){ const k = st.findIndex(x => x.name.toLowerCase() === String(u.name).toLowerCase()); if (k >= 0){ const r = useStock(st, k, Number(u.qty)); if (r) ch.push(r); } }
  if (!ch.length) return null;
  S.profile = {...S.profile, stock:st}; saveProfile();
  return ch;
}
function undoStockUse(ch){
  if (!Array.isArray(ch) || !ch.length) return false;
  const st = stock().map(x => ({...x}));
  for (const c of ch){ const k = st.findIndex(x => x.name.toLowerCase() === c.name.toLowerCase());
    if (c.removed){ if (k < 0) st.push(c.removed); } else if (k >= 0) st[k] = {...st[k], amount:c.before}; }
  S.profile = {...S.profile, stock:st}; saveProfile(); return true;
}
const stockMsg = ch => (ch || []).map(c => c.removed ? `${c.name} used up` : `${c.name} ${c.before} → ${c.after}`).join(", ");
function applyStock(ops){
  if (!Array.isArray(ops) || !ops.length) return 0;
  const st = stock().map(x => ({...x})); let n = 0;
  for (const o of ops.slice(0, 20)){
    if (!o || !o.name) continue;
    const name = String(o.name).slice(0, 80), k = st.findIndex(x => x.name.toLowerCase() === name.toLowerCase());
    if (o.op === "remove" || o.op === "used_up"){ if (k >= 0){ st.splice(k, 1); n++; } continue; }
    if (o.op === "use"){ if (k >= 0 && useStock(st, k, Number(o.qty) || 1)) n++; continue; }
    const area = AREA[o.area] ? o.area : (k >= 0 ? st[k].area : "pantry");
    const patch = {name, area, amount:String(o.amount ?? (k >= 0 ? st[k].amount : "")).slice(0, 40), note:String(o.note ?? (k >= 0 ? st[k].note : "")).slice(0, 160), useUp: k >= 0 && st[k].useUpBy === "you" ? !!st[k].useUp : o.useUp != null ? !!o.useUp : (k >= 0 ? !!st[k].useUp : area === "snacks"), ...(validISO(o.expires) ? {expires:o.expires} : k >= 0 && st[k].expires ? {expires:st[k].expires} : {}), at:Date.now(), day:today()};
    if (k >= 0) st[k] = {...st[k], ...patch}; else st.push({id:uid(), ...patch});
    n++;
  }
  S.profile = {...S.profile, stock:st};
  return n;
}

// ---------- tidy the file ----------
async function tidyProfile(){
  if (!S.sample || S.tidying) return;
  const secs = S.profile.sections || {};
  const flat = [];
  for (const [id] of SECTIONS) for (const i of (secs[id] || [])) flat.push({id:i.id, section:id, text:i.text, until:i.until || null, said:(i.quote || "").slice(0, 120)});
  if (!flat.length){ toast("Nothing to tidy yet."); return; }
  S.tidying = true; render();
  try {
    const res = await S.sample.json(`You are ${COACH}, a nutrition coach, tidying your working file on a client. Today is ${today()}.
Current file items (JSON): ${JSON.stringify(flat)}
Foods with exact numbers: ${JSON.stringify(S.profile.foods || [])}
Your current story about them: ${S.meta.story || "(none)"}
Recent conversation, for context:
${transcript()}

Rewrite the file so it's clean and current:
- Merge duplicates and near-duplicates into one clear item. Resolve contradictions using the most recent information (e.g. "usually roti, porottas for now").
- Put each item in the right section: ${SECTIONS.map(s => `${s[0]} (${s[2]} › ${s[1]})`).join(", ")}.
- Temporary situations go in right_now with an "until" date.
- Exact nutrition (labels, recipes) goes in "foods" with per-serving numbers, not in notes.
- Keep every true fact; drop nothing they told you that's still true. Keep their meaning; short clear phrases.
- For each new item list "from": the ids of the old items it came from.
- Write "story": 3 to 6 sentences to them in your voice: who they are as an eater and athlete, what drives them, current patterns, what you're working on.
- Refresh your working notes ("coach"): interpretations, aims, plan, changes, watching, questions. Keep what still holds; drop what's resolved. Current notes:
${coachNotesText()}
Reply with only JSON: {"sections":{"<section id>":[{"text":"...","until":null,"from":["old ids"]}]},"foods":[{"name":"","serving":"","kcal":0,"protein":0,"carbs":0,"fat":0,"satFat":0,"fiber":0,"source":""}],"story":"...","coach":{"interpretations":[{"text":"","confidence":"","evidence":""}],"aims":[{"text":"","horizon":""}],"plan":[{"phase":"","when":"","focus":"","status":""}],"changes":[{"what":"","why":"","when":"","priority":"","status":""}],"watching":[""],"questions":[""]}}`, {cache:false});
    if (!res || typeof res.sections !== "object") throw {code:"invalid_json"};
    const byId = Object.fromEntries(flat.map(f => [f.id, (secs[f.section] || []).find(i => i.id === f.id)]));
    const next = {};
    for (const [sid, items] of Object.entries(res.sections)){
      if (!SEC[sid] || !Array.isArray(items)) continue;
      next[sid] = items.filter(x => x && x.text).slice(0, 20).map(x => {
        const src = (Array.isArray(x.from) ? x.from : []).map(id => byId[id]).filter(Boolean);
        const first = src[0] || {};
        return {id:uid(), text:String(x.text).slice(0, 300), at:Date.now(), day:first.day || today(), quote:src.map(s => s.quote).filter(Boolean).slice(0, 2).join(" · ").slice(0, 300), photo:first.photo || null, ...(validISO(x.until) ? {until:x.until} : {})};
      });
    }
    const usedIds = new Set(Object.values(res.sections).flatMap(items => Array.isArray(items) ? items.flatMap(x => x && Array.isArray(x.from) ? x.from : []) : []));
    let kept = 0;
    for (const f of flat) if (!usedIds.has(f.id) && byId[f.id]){ (next[f.section] = next[f.section] || []).push(byId[f.id]); kept++; }
    if (kept) console.info("tidy kept", kept, "items it didn't account for");
    const foods = (Array.isArray(res.foods) ? res.foods : []).filter(f => f && f.name).slice(0, 40).map(f => ({id:uid(), name:String(f.name).slice(0, 90), serving:String(f.serving || "1 serving").slice(0, 50), kcal:r1(f.kcal) || 0, protein:r1(f.protein) || 0, carbs:r1(f.carbs) || 0, fat:r1(f.fat) || 0, satFat:r1(f.satFat) || 0, fiber:r1(f.fiber) || 0, ...(f.chol != null ? {chol:r1(f.chol) || 0} : {}), ...(f.sugar != null ? {sugar:r1(f.sugar) || 0} : {}), source:String(f.source || "").slice(0, 80), day:today()}));
    const meta = {...clone(S.meta), profileBackup:{sections:secs, foods:S.profile.foods || [], story:S.meta.story || "", coach:S.meta.coach || null, at:Date.now()}};
    if (res.coach) mergeCoach(meta, {...res.coach, journal:undefined});
    if (typeof res.story === "string" && res.story.trim()){ meta.story = res.story.trim().slice(0, 1500); meta.storyAt = Date.now(); }
    S.meta = meta; write("meta/main", () => ref("meta/main").set(meta)).catch(() => {});
    S.profile = {...S.profile, sections:next, foods: foods.length ? foods : (S.profile.foods || [])};
    await saveProfile();
    toast("Tidied. You can undo this from the top of the page.");
  } catch (e){ toast(sampleMsg(e)); }
  finally { S.tidying = false; render(); }
}
async function undoTidy(){
  const b = S.meta.profileBackup; if (!b) return;
  // keep every saved food: merge the backup's with what's there now, so an undo can never wipe label numbers
  const fm = new Map(); for (const f of [...(b.foods || []), ...(S.profile.foods || [])]) if (f && f.name) fm.set(String(f.name).toLowerCase(), f);
  S.profile = {...S.profile, sections:b.sections || {}, foods:[...fm.values()]};
  const meta = {...clone(S.meta), story:b.story || S.meta.story}; if (b.coach) meta.coach = b.coach; delete meta.profileBackup;
  S.meta = meta; write("meta/main", () => ref("meta/main").set(meta)).catch(() => {});
  await saveProfile(); toast("Put back the way it was."); render();
}

function monthStats(ym){

  const devs = (S.meta.deviations || []).filter(x => x.date >= start && x.date <= end), by = {};
