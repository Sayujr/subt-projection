name: Build Android widget APK

on:
  push:
    paths:
      - 'android-widget/**'
      - '.github/workflows/android-widget.yml'
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a GitHub release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-widget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the private signing key from secrets (if set)
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            # Tolerate spaces / line breaks picked up when pasting the secret
            CLEAN=$(printf '%s' "$KS" | tr -d ' \r\n\t')
            echo "Keystore secret length after cleanup: ${#CLEAN} characters"
            if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null || [ ! -s "$RUNNER_TEMP/release.jks" ]; then
              echo "::error::SIGNING_KEYSTORE_B64 isn't valid base64 (probably cut short when copying). Re-paste it."
              exit 1
            fi
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the private key from secrets"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 not set, so signing with the key in the repo"
          fi

      - name: Build debug APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk training-widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: training-widget-apk
          path: android-widget/training-widget.apk

      - name: Publish as "android-widget-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-widget-latest
          name: Training Today widget (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: android-widget/training-widget.apk
          body: |
            Android home-screen widget showing today's intervals.icu workouts plus Fitness / Fatigue / Form trends.
            Download `training-widget.apk` on your phone and open it to install (allow "install unknown apps" for your browser).
            Built from ${{ github.sha }}.
