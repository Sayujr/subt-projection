name: Build Android widget APK

on:
  push:
    paths:
      - 'android-widget/**'
      - '.github/workflows/android-widget.yml'
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a GitHub release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-widget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # keep the dependency cache on this branch too (fewer Maven Central downloads / 429s)
          cache-read-only: false

      - name: Use the private signing key from secrets
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          PW_SECRET: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            # Tolerate spaces / line breaks, and the whole secrets file pasted into one secret
            CLEAN=$(printf '%s' "$KS" | tr -d ' \r\n\t')
            PW_FROM_KS=""
            case "$CLEAN" in *SIGNING_PASSWORD*) PW_FROM_KS="${CLEAN##*SIGNING_PASSWORD}";; esac
            CLEAN="${CLEAN#SIGNING_KEYSTORE_B64}"
            CLEAN="${CLEAN%%SIGNING_PASSWORD*}"
            PW=$(printf '%s' "$PW_SECRET" | tr -d ' \r\n\t')
            PW="${PW##*SIGNING_PASSWORD}"
            if [ ${#PW} -ne 32 ] && [ -n "$PW_FROM_KS" ]; then PW="$PW_FROM_KS"; fi
            echo "::add-mask::$PW"
            echo "Keystore length ${#CLEAN} characters, password length ${#PW}"
            if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null || [ ! -s "$RUNNER_TEMP/release.jks" ]; then
              echo "::error::SIGNING_KEYSTORE_B64 isn't valid base64 (probably cut short when copying). Re-paste it."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" >/dev/null 2>&1; then
              echo "::error::The signing password doesn't open the keystore. Re-paste SIGNING_PASSWORD."
              exit 1
            fi
            echo "NEW_KS=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "NEW_PW=$PW" >> "$GITHUB_ENV"
            echo "Private signing key ready"
          else
            echo "::error::SIGNING_KEYSTORE_B64 secret is missing. Not building, because an APK signed with another key wouldn't install as an update."
            exit 1
          fi

      # Training-rule tests must pass, or nothing is published. The same run renders every screen
      # and widget from sample data to PNGs (build/screens) for a visual check.
      - name: Check training rules and render screens
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest

      - name: Zip screenshots
        if: always()
        run: |
          mkdir -p build/screens
          (cd build && zip -qr ../screens.zip screens) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: android-widget/screens.zip

      - name: Build release APK (unsigned)
        run: |
          ./gradlew --no-daemon assembleRelease

      # Key rotation (APK Signature Scheme v3): signed by the old key with a proof that the private
      # key replaces it, so it installs over copies signed with the old key, without an uninstall.
      # Phones that have it then trust only the private key; an APK signed with just the old key is refused.
      - name: Sign with key rotation (old key -> private key)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools $(basename "$BT")"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" rotate --out "$RUNNER_TEMP/lineage.bin" \
            --old-signer --ks keystore/legacy-public.jks --ks-key-alias trainingwidget --ks-pass pass:trainingwidget --key-pass pass:trainingwidget \
            --new-signer --ks "$NEW_KS" --ks-key-alias trainingtoday --ks-pass env:NEW_PW --key-pass env:NEW_PW
          "$BT/apksigner" sign \
            --ks keystore/legacy-public.jks --ks-key-alias trainingwidget --ks-pass pass:trainingwidget --key-pass pass:trainingwidget \
            --next-signer --ks "$NEW_KS" --ks-key-alias trainingtoday --ks-pass env:NEW_PW --key-pass env:NEW_PW \
            --lineage "$RUNNER_TEMP/lineage.bin" \
            --out training-widget.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify -v --print-certs training-widget.apk | grep -E "Verified using|Number of signers|certificate DN|lineage" || true

      - uses: actions/upload-artifact@v4
        with:
          name: training-widget-apk
          path: android-widget/training-widget.apk

      - name: Publish as "android-widget-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-widget-latest
          name: Training Today widget (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            android-widget/training-widget.apk
            android-widget/screens.zip
          body: |
            Android home-screen widget showing today's intervals.icu workouts plus Fitness / Fatigue / Form trends.
            Download `training-widget.apk` on your phone and open it to install (allow "install unknown apps" for your browser).
            Built from ${{ github.sha }}.
